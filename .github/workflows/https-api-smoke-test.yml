name: HTTPS API smoke test
run-name: HTTPS API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe official HTTPS apartment trade APIs
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          import requests

          key = os.environ.get("MOLIT_API_KEY")
          if not key:
              raise SystemExit("MOLIT_API_KEY is missing")

          endpoints = {
              "detailed": (
                  "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/"
                  "getRTMSDataSvcAptTradeDev"
              ),
              "standard": (
                  "https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/"
                  "getRTMSDataSvcAptTrade"
              ),
          }
          params = {
              "serviceKey": key,
              "LAWD_CD": "11110",
              "DEAL_YMD": "202608",
              "pageNo": 1,
              "numOfRows": 10,
          }
          required = {
              "dealYear",
              "dealMonth",
              "dealDay",
              "dealAmount",
              "aptNm",
              "excluUseAr",
              "umdNm",
              "jibun",
              "floor",
              "buildYear",
          }

          usable = []
          for name, url in endpoints.items():
              try:
                  response = requests.get(url, params=params, timeout=30)
                  print(f"{name}: HTTP {response.status_code}")
                  if response.status_code != 200:
                      continue
                  root = ET.fromstring(response.text)
                  code = root.findtext(".//resultCode")
                  message = root.findtext(".//resultMsg")
                  items = root.findall(".//item")
                  print(f"{name}: result={code}/{message}, items={len(items)}")
                  if code not in ("00", "000") or not items:
                      continue
                  fields = {child.tag for child in items[0]}
                  missing = sorted(required - fields)
                  print(f"{name}: missing_required_fields={missing}")
                  print(
                      f"{name}: aptSeq={'aptSeq' in fields}, "
                      f"cdealType={'cdealType' in fields}"
                  )
                  if not missing:
                      usable.append(name)
              except requests.RequestException as error:
                  print(f"{name}: network_error={type(error).__name__}")
              except ET.ParseError:
                  print(f"{name}: invalid_xml")

          if not usable:
              raise SystemExit("No usable HTTPS apartment trade API")
          print("Usable HTTPS endpoints:", ", ".join(usable))
          PY
