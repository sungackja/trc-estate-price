name: HTTPS relay smoke test
run-name: HTTPS relay smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
    steps:
      - name: Reject unauthenticated request
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}'             --get "https://trc-estate-price.vercel.app/api/molit"             --data-urlencode "LAWD_CD=11110"             --data-urlencode "DEAL_YMD=202607")
          test "$status" = "401"
          echo "Unauthenticated request rejected with 401"

      - name: Compare authenticated page sizes
        run: |
          for rows in 10 100 1000; do
            status=$(curl --silent --show-error --max-time 60               --header "Authorization: Bearer $MOLIT_API_KEY"               --get "https://trc-estate-price.vercel.app/api/molit"               --data-urlencode "LAWD_CD=11110"               --data-urlencode "DEAL_YMD=202607"               --data-urlencode "pageNo=1"               --data-urlencode "numOfRows=$rows"               --output "relay-$rows.xml"               --write-out '%{http_code}')
            bytes=$(wc -c < "relay-$rows.xml")
            echo "numOfRows=$rows status=$status bytes=$bytes"
          done

      - name: Validate successful XML response
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          usable = []
          for rows in (10, 100, 1000):
              path = Path(f"relay-{rows}.xml")
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  print(f"numOfRows={rows}: not XML")
                  continue
              code = root.findtext(".//resultCode")
              items = root.findall(".//item")
              print(f"numOfRows={rows}: result={code}, items={len(items)}")
              if code in ("00", "000") and items:
                  usable.append(rows)

          if not usable:
              raise SystemExit("No usable relay page size")
          print("Usable page sizes:", usable)
          PY
